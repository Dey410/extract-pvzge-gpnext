name: Extract PvZGE Tauri Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Gzh0821/pvzg_site 的 Release 标签（留空则使用最新版）"
        required: false
      asset_name:
        description: "Release 中的 ZIP 或 EXE 文件名（留空则自动选择）"
        required: false
      image_transcode_format:
        description: "图片转码格式：none=不转码（默认），avif=原地转 AVIF（保留 .png 路径），astc=仅 Cocos native 纹理转 ASTC 并改写元数据"
        required: true
        default: none
        type: choice
        options:
          - none
          - avif
          - astc
      enable_mp3_transcode:
        description: "启用 MP3→M4A/AAC 原地转码"
        required: true
        default: false
        type: boolean
      enable_audio_lazy_loading:
        description: "构建时修改运行时代码，使音频仅在播放时加载"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download and unpack PvZGE EXE
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          REQUESTED_ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail

          mkdir -p input

          RELEASE_TAG="$REQUESTED_RELEASE_TAG"
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$(
              gh release list \
                --repo Gzh0821/pvzg_site \
                --exclude-drafts \
                --limit 1 \
                --json tagName \
                --jq '.[0].tagName'
            )"

            if [[ -z "$RELEASE_TAG" ]]; then
              echo "::error::Gzh0821/pvzg_site 没有可用的非草稿 Release"
              exit 1
            fi
          fi

          ASSET_NAME="$REQUESTED_ASSET_NAME"
          if [[ -z "$ASSET_NAME" ]]; then
            mapfile -t ASSET_CANDIDATES < <(
              gh release view "$RELEASE_TAG" \
                --repo Gzh0821/pvzg_site \
                --json assets \
                --jq '.assets[].name' \
                | grep -Ei '\.(zip|exe)$'
            )

            if [[ "${#ASSET_CANDIDATES[@]}" -ne 1 ]]; then
              echo "::error::Release $RELEASE_TAG 必须恰好包含一个 ZIP 或 EXE，实际找到 ${#ASSET_CANDIDATES[@]} 个"
              printf '%s\n' "${ASSET_CANDIDATES[@]}"
              exit 1
            fi

            ASSET_NAME="${ASSET_CANDIDATES[0]}"
          fi

          echo "Using release $RELEASE_TAG asset $ASSET_NAME"

          gh release download "$RELEASE_TAG" \
            --repo Gzh0821/pvzg_site \
            --pattern "$ASSET_NAME" \
            --dir input

          DOWNLOAD="input/$ASSET_NAME"

          if [[ ! -s "$DOWNLOAD" ]]; then
            echo "::error::没有下载到 $DOWNLOAD"
            exit 1
          fi

          case "$ASSET_NAME" in
            *.zip)
              mapfile -t EXE_ENTRIES < <(
                unzip -Z1 "$DOWNLOAD" | grep -Ei '\.exe$'
              )

              if [[ "${#EXE_ENTRIES[@]}" -ne 1 ]]; then
                echo "::error::$DOWNLOAD 必须恰好包含一个 EXE，实际找到 ${#EXE_ENTRIES[@]} 个"
                printf '%s\n' "${EXE_ENTRIES[@]}"
                exit 1
              fi

              EXE_ENTRY="${EXE_ENTRIES[0]}"
              EXE="input/$(basename -- "$EXE_ENTRY")"
              unzip -p "$DOWNLOAD" "$EXE_ENTRY" > "$EXE"
              ;;
            *.exe)
              EXE="$DOWNLOAD"
              ;;
            *)
              echo "::error::不支持的 Release 资源类型: $ASSET_NAME"
              exit 1
              ;;
          esac

          if [[ ! -s "$EXE" ]]; then
            echo "::error::没有得到可用的 EXE: $EXE"
            exit 1
          fi

          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "ASSET_NAME=$ASSET_NAME"
            echo "EXE=$EXE"
          } >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          ls -lh "$DOWNLOAD"
          ls -lh "$EXE"
          sha256sum "$DOWNLOAD"
          if [[ "$EXE" != "$DOWNLOAD" ]]; then
            sha256sum "$EXE"
          fi

      - name: Install tauri-dumper
        shell: bash
        run: |
          set -euo pipefail
          cargo install tauri-dumper --version 0.2.2 --locked
          tauri-dumper --version

      - name: Verify Tauri assets
        shell: bash
        run: |
          set -euo pipefail
          tauri-dumper verify "$EXE"

      - name: List embedded assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          tauri-dumper list "$EXE" | tee reports/assets-tree.txt
          tauri-dumper list "$EXE" --json > reports/assets.json

      - name: Extract embedded assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs

          tauri-dumper extract "$EXE" \
            -o docs \
            --overwrite

      - name: Check extracted Web files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== 提取目录大小 ====="
          du -sh docs

          echo "===== 目标文件与目录 ====="
          find docs \
            \( -name "index.html" \
            -o -name "application.js" \
            -o -name "assets" \
            -o -name "src" \
            -o -name "cocos-js" \) \
            -print | tee reports/target-files.txt

          if ! find docs -type f -name "index.html" -print -quit | grep -q .; then
            echo "::error::没有找到 index.html"
            exit 1
          fi

      - name: Patch runtime for lazy DOM audio loading
        if: ${{ inputs.enable_audio_lazy_loading }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_audio_runtime.py \
            docs \
            reports/audio-runtime-patch.txt

      - name: Install asset transcode tools
        if: ${{ inputs.image_transcode_format != 'none' || inputs.enable_mp3_transcode }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            ffmpeg

          if [[ "${{ inputs.image_transcode_format }}" == "avif" ]]; then
            sudo apt-get install \
              --yes \
              --no-install-recommends \
              libavif-bin
            avifenc --version
          fi

          if [[ "${{ inputs.image_transcode_format }}" == "astc" ]]; then
            sudo apt-get install \
              --yes \
              --no-install-recommends \
              curl \
              python3-pil \
              unzip

            ASTCENC_VERSION="5.6.0"
            ASTCENC_ARCHIVE="astcenc-${ASTCENC_VERSION}-linux-x64.zip"
            ASTCENC_SHA256="4fa262fb4883997b2b38a95c0de3b7ee26d22ac7ab1ebd030558089f2e917502"
            ASTCENC_URL="https://github.com/ARM-software/astc-encoder/releases/download/${ASTCENC_VERSION}/${ASTCENC_ARCHIVE}"
            ASTCENC_DOWNLOAD="$RUNNER_TEMP/$ASTCENC_ARCHIVE"
            ASTCENC_EXTRACT="$RUNNER_TEMP/astcenc-$ASTCENC_VERSION"
            ASTCENC_BIN_DIR="$RUNNER_TEMP/astcenc-bin"

            curl \
              --fail \
              --location \
              --proto '=https' \
              --tlsv1.2 \
              --retry 5 \
              --retry-all-errors \
              --output "$ASTCENC_DOWNLOAD" \
              "$ASTCENC_URL"
            echo "$ASTCENC_SHA256  $ASTCENC_DOWNLOAD" \
              | sha256sum --check --strict
            unzip -q "$ASTCENC_DOWNLOAD" -d "$ASTCENC_EXTRACT"

            CPU_FLAGS=" $(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2-) "
            if [[ "$CPU_FLAGS" == *" avx2 "* \
              && "$CPU_FLAGS" == *" sse4_2 "* \
              && "$CPU_FLAGS" == *" popcnt "* \
              && "$CPU_FLAGS" == *" f16c "* ]]; then
              ASTCENC_VARIANT="avx2"
            elif [[ "$CPU_FLAGS" == *" sse4_1 "* \
              && "$CPU_FLAGS" == *" popcnt "* ]]; then
              ASTCENC_VARIANT="sse4.1"
            else
              ASTCENC_VARIANT="sse2"
            fi

            mkdir -p "$ASTCENC_BIN_DIR"
            install \
              -m 0755 \
              "$ASTCENC_EXTRACT/bin/astcenc-$ASTCENC_VARIANT" \
              "$ASTCENC_BIN_DIR/astcenc"
            echo "$ASTCENC_BIN_DIR" >> "$GITHUB_PATH"
            "$ASTCENC_BIN_DIR/astcenc" -version
          fi

          ffmpeg -version

      - name: Transcode assets in place
        if: ${{ inputs.image_transcode_format == 'avif' || inputs.enable_mp3_transcode }}
        shell: bash
        env:
          ENABLE_PNG_TRANSCODE: ${{ inputs.image_transcode_format == 'avif' }}
          ENABLE_MP3_TRANSCODE: ${{ inputs.enable_mp3_transcode }}
        run: |
          set -euo pipefail
          bash scripts/transcode-assets.sh docs reports/transcode-summary.txt

      - name: Transcode textures to ASTC without fallbacks
        if: ${{ inputs.image_transcode_format == 'astc' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/transcode_textures_astc.py \
            docs \
            reports/astc-texture-summary.txt

      - name: Upload extracted assets
        uses: actions/upload-artifact@v4
        with:
          name: pvzge-gpnext-${{ steps.download.outputs.release_tag }}
          path: |
            docs/
            reports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
