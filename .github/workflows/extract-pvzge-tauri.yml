name: Extract PvZGE Lite Tauri Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Gzh0821/pvzg_site 的 Release 标签（留空则使用最新非草稿 Release，包含 Pre-release）"
        required: false

      image_transcode_format:
        description: "图片处理：none=保留原图；astc=将 native AVIF/PNG 转为 ASTC，保留原图并更新元数据（设备需支持 ASTC）"
        required: true
        default: none
        type: choice
        options:
          - none
          - astc

      enable_hybrid_audio_loading:
        description: "按时长选择音频后端：长音频懒加载 DOM，短音频使用 Web Audio"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TAURI_DUMPER_VERSION: "0.2.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 获取最新 Release 中非 macOS 的 pvzge-lite-*.zip
      # ============================================================

      - name: Download and unpack PvZGE Lite
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          REPO="Gzh0821/pvzg_site"

          mkdir -p input reports

          RELEASE_TAG="$REQUESTED_RELEASE_TAG"

          # 未指定 tag 时：
          # 获取最新非 Draft Release
          # Pre-release 也包含在内
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$(
              gh release list \
                --repo "$REPO" \
                --exclude-drafts \
                --limit 1 \
                --json tagName \
                --jq '.[0].tagName'
            )"
          fi

          if [[ -z "$RELEASE_TAG" ]]; then
            echo "::error::$REPO 没有可用的 Release"
            exit 1
          fi

          echo "===== Release ====="
          echo "$RELEASE_TAG"

          # ----------------------------------------------------------
          # 获取 Release Asset
          # ----------------------------------------------------------

          RELEASE_JSON="$(
            gh release view "$RELEASE_TAG" \
              --repo "$REPO" \
              --json assets
          )"

          echo "===== Release assets ====="
          jq -r '.assets[].name' <<< "$RELEASE_JSON"

          # ----------------------------------------------------------
          # 只选择：
          #
          # pvzge-lite-0.13.0.zip
          #
          # 排除：
          #
          # pvzge-lite-macos-0.13.0.zip
          # ----------------------------------------------------------

          mapfile -t ASSET_CANDIDATES < <(
            jq -r '.assets[].name' <<< "$RELEASE_JSON" \
              | grep -Ei '^pvzge-lite-.+\.zip$' \
              | grep -Eiv '^pvzge-lite-macos-' \
              || true
          )

          if [[ "${#ASSET_CANDIDATES[@]}" -eq 0 ]]; then
            echo "::error::Release $RELEASE_TAG 中没有找到非 macOS 的 pvzge-lite-*.zip"
            exit 1
          fi

          if [[ "${#ASSET_CANDIDATES[@]}" -ne 1 ]]; then
            echo "::error::Release $RELEASE_TAG 中找到多个非 macOS 的 pvzge-lite-*.zip"
            echo "===== Candidates ====="
            printf '%s\n' "${ASSET_CANDIDATES[@]}"
            exit 1
          fi

          ASSET_NAME="${ASSET_CANDIDATES[0]}"
          DOWNLOAD="input/$ASSET_NAME"

          echo "===== Selected asset ====="
          echo "$ASSET_NAME"

          # ----------------------------------------------------------
          # 下载 ZIP
          # ----------------------------------------------------------

          gh release download "$RELEASE_TAG" \
            --repo "$REPO" \
            --pattern "$ASSET_NAME" \
            --dir input

          if [[ ! -s "$DOWNLOAD" ]]; then
            echo "::error::没有下载到有效文件：$DOWNLOAD"
            exit 1
          fi

          echo "===== Downloaded ZIP ====="
          ls -lh "$DOWNLOAD"

          echo "===== ZIP SHA-256 ====="
          sha256sum "$DOWNLOAD"

          # ----------------------------------------------------------
          # 从 ZIP 中提取 EXE
          # ----------------------------------------------------------

          mapfile -t EXE_ENTRIES < <(
            unzip -Z1 "$DOWNLOAD" \
              | grep -Ei '\.exe$' \
              || true
          )

          if [[ "${#EXE_ENTRIES[@]}" -eq 0 ]]; then
            echo "::error::$DOWNLOAD 中没有找到 EXE"
            exit 1
          fi

          if [[ "${#EXE_ENTRIES[@]}" -ne 1 ]]; then
            echo "::error::$DOWNLOAD 必须恰好包含一个 EXE，实际找到 ${#EXE_ENTRIES[@]} 个"

            echo "===== EXE candidates ====="
            printf '%s\n' "${EXE_ENTRIES[@]}"

            exit 1
          fi

          EXE_ENTRY="${EXE_ENTRIES[0]}"
          EXE="input/$(basename -- "$EXE_ENTRY")"

          echo "===== Extract EXE ====="
          echo "$EXE_ENTRY"
          echo "-> $EXE"

          unzip -p \
            "$DOWNLOAD" \
            "$EXE_ENTRY" \
            > "$EXE"

          if [[ ! -s "$EXE" ]]; then
            echo "::error::没有得到可用的 EXE：$EXE"
            exit 1
          fi

          echo "===== EXE ====="
          ls -lh "$EXE"

          echo "===== EXE SHA-256 ====="
          sha256sum "$EXE"

          # ----------------------------------------------------------
          # 保存环境变量 / outputs
          # ----------------------------------------------------------

          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "ASSET_NAME=$ASSET_NAME"
            echo "EXE=$EXE"
          } >> "$GITHUB_ENV"

          {
            echo "release_tag=$RELEASE_TAG"
            echo "asset_name=$ASSET_NAME"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # tauri-dumper
      # ============================================================

      - name: Cache tauri-dumper
        id: cache_tauri_dumper
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-dumper
          key: ${{ runner.os }}-tauri-dumper-${{ env.TAURI_DUMPER_VERSION }}

      - name: Install Rust
        if: steps.cache_tauri_dumper.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-dumper
        if: steps.cache_tauri_dumper.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cargo install \
            tauri-dumper \
            --version "$TAURI_DUMPER_VERSION" \
            --locked

      - name: Configure tauri-dumper
        shell: bash
        run: |
          set -euo pipefail

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          if [[ ! -x "$HOME/.cargo/bin/tauri-dumper" ]]; then
            echo "::error::tauri-dumper 不存在"
            exit 1
          fi

          "$HOME/.cargo/bin/tauri-dumper" --version

      # ============================================================
      # 验证 Tauri
      # ============================================================

      - name: Verify Tauri assets
        shell: bash
        run: |
          set -euo pipefail

          tauri-dumper verify "$EXE" \
            2>&1 | tee reports/tauri-verify.txt

      # ============================================================
      # 列出嵌入资源
      # ============================================================

      - name: List embedded assets
        shell: bash
        run: |
          set -euo pipefail

          tauri-dumper list "$EXE" \
            | tee reports/assets-tree.txt

          tauri-dumper list "$EXE" \
            --json \
            > reports/assets.json

      # ============================================================
      # 提取资源
      # ============================================================

      - name: Extract embedded assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf docs
          mkdir -p docs

          tauri-dumper extract "$EXE" \
            -o docs \
            --overwrite \
            2>&1 | tee reports/tauri-extract.txt

      # ============================================================
      # 检查提取结果
      # ============================================================

      - name: Check extracted Web files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== 提取目录大小 ====="
          du -sh docs

          echo "===== 文件数量 ====="
          find docs -type f | wc -l

          echo "===== 目标文件与目录 ====="

          find docs \
            \( \
              -name "index.html" \
              -o -name "application.js" \
              -o -name "assets" \
              -o -name "src" \
              -o -name "cocos-js" \
            \) \
            -print \
            | tee reports/target-files.txt

          INDEX_HTML="$(
            find docs \
              -type f \
              -name "index.html" \
              -print \
              -quit
          )"

          if [[ -z "$INDEX_HTML" ]]; then
            echo "::error::没有找到 index.html"
            exit 1
          fi

          echo "===== index.html ====="
          echo "$INDEX_HTML"

      # ============================================================
      # 混合音频加载
      #
      # 不进行任何音频转码或压缩
      # ============================================================

      - name: Ensure ffprobe is available
        if: ${{ inputs.enable_hybrid_audio_loading }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi

          ffprobe -version

      - name: Patch runtime for hybrid audio loading
        if: ${{ inputs.enable_hybrid_audio_loading }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f scripts/patch_audio_runtime.py ]]; then
            echo "::error::缺少 scripts/patch_audio_runtime.py"
            exit 1
          fi

          python3 scripts/patch_audio_runtime.py \
            docs \
            reports/audio-runtime-patch.txt

      # ============================================================
      # ASTC 纹理转换（参数沿用 compact-150-audio-policy）
      # ============================================================

      - name: Set up Python for ASTC
        if: ${{ inputs.image_transcode_format == 'astc' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ASTC tools
        if: ${{ inputs.image_transcode_format == 'astc' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --only-binary=:all: -r scripts/requirements-astc.txt
          python3 -c 'from PIL import features; assert features.check("avif"), "Pillow AVIF decoder unavailable"'

          ASTCENC_VERSION="5.6.0"
          ASTCENC_ARCHIVE="astcenc-${ASTCENC_VERSION}-linux-x64.zip"
          ASTCENC_SHA256="4fa262fb4883997b2b38a95c0de3b7ee26d22ac7ab1ebd030558089f2e917502"
          ASTCENC_URL="https://github.com/ARM-software/astc-encoder/releases/download/${ASTCENC_VERSION}/${ASTCENC_ARCHIVE}"
          ASTCENC_DOWNLOAD="$RUNNER_TEMP/$ASTCENC_ARCHIVE"
          ASTCENC_EXTRACT="$RUNNER_TEMP/astcenc-$ASTCENC_VERSION"
          ASTCENC_BIN_DIR="$RUNNER_TEMP/astcenc-bin"

          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$ASTCENC_DOWNLOAD" "$ASTCENC_URL"
          echo "$ASTCENC_SHA256  $ASTCENC_DOWNLOAD" | sha256sum --check --strict
          unzip -q "$ASTCENC_DOWNLOAD" -d "$ASTCENC_EXTRACT"

          CPU_FLAGS=" $(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2-) "
          if [[ "$CPU_FLAGS" == *" avx2 "* \
            && "$CPU_FLAGS" == *" sse4_2 "* \
            && "$CPU_FLAGS" == *" popcnt "* \
            && "$CPU_FLAGS" == *" f16c "* ]]; then
            ASTCENC_VARIANT="avx2"
          elif [[ "$CPU_FLAGS" == *" sse4_1 "* \
            && "$CPU_FLAGS" == *" popcnt "* ]]; then
            ASTCENC_VARIANT="sse4.1"
          else
            ASTCENC_VARIANT="sse2"
          fi
          mkdir -p "$ASTCENC_BIN_DIR"
          install -m 0755 "$ASTCENC_EXTRACT/bin/astcenc-$ASTCENC_VARIANT" \
            "$ASTCENC_BIN_DIR/astcenc"
          echo "$ASTCENC_BIN_DIR" >> "$GITHUB_PATH"
          "$ASTCENC_BIN_DIR/astcenc" -version

      - name: Test ASTC conversion
        if: ${{ inputs.image_transcode_format == 'astc' }}
        shell: bash
        run: python3 -m unittest discover -s tests -v

      - name: Transcode native textures to ASTC
        if: ${{ inputs.image_transcode_format == 'astc' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/transcode_textures_astc.py \
            docs reports/astc-texture-summary.txt

      # ============================================================
      # 最终信息
      # ============================================================

      - name: Show final asset information
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Release ====="
          echo "$RELEASE_TAG"

          echo "===== Source asset ====="
          echo "$ASSET_NAME"

          echo "===== Final docs size ====="
          du -sh docs

          echo "===== Final file count ====="
          find docs -type f | wc -l

          echo "===== Reports ====="
          find reports \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ============================================================
      # 上传 Artifact
      # ============================================================

      - name: Upload extracted assets
        uses: actions/upload-artifact@v4
        with:
          name: pvzge-lite-${{ steps.download.outputs.release_tag }}
          path: |
            docs/
            reports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
