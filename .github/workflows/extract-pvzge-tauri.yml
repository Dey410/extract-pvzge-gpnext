name: Extract PvZGE Lite Tauri Assets
run-name: "${{ inputs.release_tag || '最新' }} · ${{ inputs.publish && '发布' || '测试' }}"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Gzh0821/pvzg_site 的 Release 标签，例如 0.15.0；留空使用最新非草稿 Release（包含 Pre-release）"
        required: false
      publish:
        description: "发布为本仓库 Release，作为下一次增量包的基础"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TAURI_DUMPER_VERSION: "0.2.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create isolated run output
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT="$(mktemp -d "$RUNNER_TEMP/gardendless-resource.XXXXXX")"
          {
            echo "RUN_ROOT=$RUN_ROOT"
            echo "INPUT_DIR=$RUN_ROOT/input"
            echo "SOURCE_DOCS=$RUN_ROOT/source-docs"
            echo "REPORTS=$RUN_ROOT/reports"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUN_ROOT/input" "$RUN_ROOT/reports"

      # ============================================================
      # 获取最新 Release 中非 macOS 的 pvzge-lite-*.zip
      # ============================================================

      - name: Download and unpack PvZGE Lite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          REPO="Gzh0821/pvzg_site"

          mkdir -p "$INPUT_DIR" "$REPORTS"

          RELEASE_TAG="$REQUESTED_RELEASE_TAG"

          # 未填写时使用最新非草稿 Release，包含 Pre-release
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$(
              gh release list \
                --repo "$REPO" \
                --exclude-drafts \
                --limit 1 \
                --json tagName \
                --jq '.[0].tagName // empty'
            )"
          fi

          if [[ -z "$RELEASE_TAG" ]]; then
            echo "::error::$REPO 没有可用的 Release"
            exit 1
          fi

          echo "===== Release ====="
          echo "$RELEASE_TAG"

          # ----------------------------------------------------------
          # 获取 Release Asset
          # ----------------------------------------------------------

          RELEASE_JSON="$(
            gh release view "$RELEASE_TAG" \
              --repo "$REPO" \
              --json assets
          )"

          echo "===== Release assets ====="
          jq -r '.assets[].name' <<< "$RELEASE_JSON"

          # ----------------------------------------------------------
          # 只选择：
          #
          # pvzge-lite-0.13.0.zip
          #
          # 排除：
          #
          # pvzge-lite-macos-0.13.0.zip
          # ----------------------------------------------------------

          mapfile -t ASSET_CANDIDATES < <(
            jq -r '.assets[].name' <<< "$RELEASE_JSON" \
              | grep -Ei '^pvzge-lite-.+\.zip$' \
              | grep -Eiv '^pvzge-lite-macos-' \
              || true
          )

          if [[ "${#ASSET_CANDIDATES[@]}" -eq 0 ]]; then
            echo "::error::Release $RELEASE_TAG 中没有找到非 macOS 的 pvzge-lite-*.zip"
            exit 1
          fi

          if [[ "${#ASSET_CANDIDATES[@]}" -ne 1 ]]; then
            echo "::error::Release $RELEASE_TAG 中找到多个非 macOS 的 pvzge-lite-*.zip"
            echo "===== Candidates ====="
            printf '%s\n' "${ASSET_CANDIDATES[@]}"
            exit 1
          fi

          ASSET_NAME="${ASSET_CANDIDATES[0]}"
          DOWNLOAD="$INPUT_DIR/$ASSET_NAME"

          echo "===== Selected asset ====="
          echo "$ASSET_NAME"

          # ----------------------------------------------------------
          # 下载 ZIP
          # ----------------------------------------------------------

          gh release download "$RELEASE_TAG" \
            --repo "$REPO" \
            --pattern "$ASSET_NAME" \
            --dir "$INPUT_DIR"

          if [[ ! -s "$DOWNLOAD" ]]; then
            echo "::error::没有下载到有效文件：$DOWNLOAD"
            exit 1
          fi

          echo "===== Downloaded ZIP ====="
          ls -lh "$DOWNLOAD"

          echo "===== ZIP SHA-256 ====="
          sha256sum "$DOWNLOAD"

          # ----------------------------------------------------------
          # 从 ZIP 中提取 EXE
          # ----------------------------------------------------------

          mapfile -t EXE_ENTRIES < <(
            unzip -Z1 "$DOWNLOAD" \
              | grep -Ei '\.exe$' \
              || true
          )

          if [[ "${#EXE_ENTRIES[@]}" -eq 0 ]]; then
            echo "::error::$DOWNLOAD 中没有找到 EXE"
            exit 1
          fi

          if [[ "${#EXE_ENTRIES[@]}" -ne 1 ]]; then
            echo "::error::$DOWNLOAD 必须恰好包含一个 EXE，实际找到 ${#EXE_ENTRIES[@]} 个"

            echo "===== EXE candidates ====="
            printf '%s\n' "${EXE_ENTRIES[@]}"

            exit 1
          fi

          EXE_ENTRY="${EXE_ENTRIES[0]}"
          EXE="$INPUT_DIR/$(basename -- "$EXE_ENTRY")"

          echo "===== Extract EXE ====="
          echo "$EXE_ENTRY"
          echo "-> $EXE"

          unzip -p \
            "$DOWNLOAD" \
            "$EXE_ENTRY" \
            > "$EXE"

          if [[ ! -s "$EXE" ]]; then
            echo "::error::没有得到可用的 EXE：$EXE"
            exit 1
          fi

          echo "===== EXE ====="
          ls -lh "$EXE"

          echo "===== EXE SHA-256 ====="
          sha256sum "$EXE"

          # ----------------------------------------------------------
          # 保存环境变量
          # ----------------------------------------------------------

          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "ASSET_NAME=$ASSET_NAME"
            echo "EXE=$EXE"
          } >> "$GITHUB_ENV"

      # ============================================================
      # tauri-dumper
      # ============================================================

      - name: Cache tauri-dumper
        id: cache_tauri_dumper
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-dumper
          key: ${{ runner.os }}-tauri-dumper-${{ env.TAURI_DUMPER_VERSION }}

      - name: Install Rust
        if: steps.cache_tauri_dumper.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-dumper
        if: steps.cache_tauri_dumper.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cargo install \
            tauri-dumper \
            --version "$TAURI_DUMPER_VERSION" \
            --locked

      - name: Configure tauri-dumper
        shell: bash
        run: |
          set -euo pipefail

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          if [[ ! -x "$HOME/.cargo/bin/tauri-dumper" ]]; then
            echo "::error::tauri-dumper 不存在"
            exit 1
          fi

          "$HOME/.cargo/bin/tauri-dumper" --version

      # ============================================================
      # 验证 Tauri
      # ============================================================

      - name: Verify Tauri assets
        shell: bash
        run: |
          set -euo pipefail

          tauri-dumper verify "$EXE" \
            2>&1 | tee "$REPORTS/tauri-verify.txt"

      # ============================================================
      # 列出嵌入资源
      # ============================================================

      - name: List embedded assets
        shell: bash
        run: |
          set -euo pipefail

          tauri-dumper list "$EXE" \
            | tee "$REPORTS/assets-tree.txt"

          tauri-dumper list "$EXE" \
            --json \
            > "$REPORTS/assets.json"

      # ============================================================
      # 提取资源
      # ============================================================

      - name: Extract embedded assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$SOURCE_DOCS"

          tauri-dumper extract "$EXE" \
            -o "$SOURCE_DOCS" \
            2>&1 | tee "$REPORTS/tauri-extract.txt"

      # ============================================================
      # 检查提取结果
      # ============================================================

      - name: Check extracted Web files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_DOCS/index.html"
          test -f "$SOURCE_DOCS/src/settings.json"
          test -f "$SOURCE_DOCS/src/import-map.json"
          test -f "$SOURCE_DOCS/cocos-js/cc.js"
          cp "$SOURCE_DOCS/tauri-dumper.manifest.json" "$REPORTS/tauri-dumper.manifest.json"
          du -sh "$SOURCE_DOCS"

      - name: Set up Python for ASTC
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node for JavaScript parse and execution gates
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ASTC tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --only-binary=:all: -r scripts/requirements-astc.txt
          python3 -c 'from PIL import features; assert features.check("avif"), "Pillow AVIF decoder unavailable"'

          ASTCENC_VERSION="5.6.0"
          ASTCENC_ARCHIVE="astcenc-${ASTCENC_VERSION}-linux-x64.zip"
          ASTCENC_SHA256="4fa262fb4883997b2b38a95c0de3b7ee26d22ac7ab1ebd030558089f2e917502"
          ASTCENC_URL="https://github.com/ARM-software/astc-encoder/releases/download/${ASTCENC_VERSION}/${ASTCENC_ARCHIVE}"
          ASTCENC_DOWNLOAD="$RUN_ROOT/$ASTCENC_ARCHIVE"
          ASTCENC_EXTRACT="$RUN_ROOT/astcenc-$ASTCENC_VERSION"
          ASTCENC_BIN_DIR="$RUN_ROOT/astcenc-bin"

          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$ASTCENC_DOWNLOAD" "$ASTCENC_URL"
          echo "$ASTCENC_SHA256  $ASTCENC_DOWNLOAD" | sha256sum --check --strict
          unzip -q "$ASTCENC_DOWNLOAD" -d "$ASTCENC_EXTRACT"

          CPU_FLAGS=" $(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2-) "
          if [[ "$CPU_FLAGS" == *" avx2 "* \
            && "$CPU_FLAGS" == *" sse4_2 "* \
            && "$CPU_FLAGS" == *" popcnt "* \
            && "$CPU_FLAGS" == *" f16c "* ]]; then
            ASTCENC_VARIANT="avx2"
          elif [[ "$CPU_FLAGS" == *" sse4_1 "* \
            && "$CPU_FLAGS" == *" popcnt "* ]]; then
            ASTCENC_VARIANT="sse4.1"
          else
            ASTCENC_VARIANT="sse2"
          fi
          mkdir -p "$ASTCENC_BIN_DIR"
          install -m 0755 "$ASTCENC_EXTRACT/bin/astcenc-$ASTCENC_VARIANT" \
            "$ASTCENC_BIN_DIR/astcenc"
          echo "$ASTCENC_BIN_DIR" >> "$GITHUB_PATH"
          "$ASTCENC_BIN_DIR/astcenc" -version

      - name: Test core pipeline
        shell: bash
        run: python3 -m unittest discover -s tests -t . -v

      - name: Patch verified Cocos audio runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.patch_audio_runtime "$SOURCE_DOCS" "$REPORTS/audio-runtime-patch.json"

      - name: Transcode native textures to ASTC
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.transcode_textures_astc \
            "$SOURCE_DOCS" "$REPORTS/astc-texture-summary.txt"

      # ============================================================
      # 增量包的基础：本仓库创建时间最新的 Release
      # ============================================================

      - name: Download base resource Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_TAG="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --exclude-drafts \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName // empty'
          )"
          BASE_ZIP=""
          if [[ -z "$BASE_TAG" ]]; then
            echo "还没有资源 Release，本次只生成完整包"
          else
            mkdir -p "$RUN_ROOT/base"
            gh release download "$BASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "GardendlessResources-$BASE_TAG.zip" \
              --dir "$RUN_ROOT/base"
            BASE_ZIP="$RUN_ROOT/base/GardendlessResources-$BASE_TAG.zip"
          fi
          {
            echo "BASE_TAG=$BASE_TAG"
            echo "BASE_ZIP=$BASE_ZIP"
          } >> "$GITHUB_ENV"

      - name: Assemble ASTC package and verify sealed ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.resource_package \
            "$SOURCE_DOCS" "$RUN_ROOT/package" "$REPORTS/astc-texture-map.csv" \
            --producer-commit "$GITHUB_SHA" --report "$REPORTS/package-build.json" \
            ${BASE_ZIP:+--base "$BASE_ZIP"}
          jq -n --arg release "$RELEASE_TAG" --arg asset "$ASSET_NAME" \
            --arg producer "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg base "$BASE_TAG" \
            '{releaseTag:$release,sourceAsset:$asset,producerCommit:$producer,runId:$run,baseRelease:$base,tauriDumper:"0.2.2",astcenc:"5.6.0",pillow:"12.1.1"}' \
            > "$REPORTS/source-build.json"

          # 包名：<游戏版本>+<packageId 前 8 位>
          PACKAGE_ID="$(jq -r .packageId "$REPORTS/package-build.json")"
          GAME_VERSION="$(jq -r .gameVersion "$RUN_ROOT/package/docs/__gardendless/package/resource-manifest.json")"
          PACKAGE_TAG="$GAME_VERSION+${PACKAGE_ID:7:8}"
          mkdir "$RUN_ROOT/release"
          mv "$RUN_ROOT/package/GardendlessResources.zip" \
            "$RUN_ROOT/release/GardendlessResources-$PACKAGE_TAG.zip"
          if [[ -n "$BASE_TAG" ]]; then
            mv "$RUN_ROOT/package/GardendlessResources-delta.zip" \
              "$RUN_ROOT/release/GardendlessResources-$PACKAGE_TAG-from-$BASE_TAG.zip"
          fi
          echo "PACKAGE_TAG=$PACKAGE_TAG" >> "$GITHUB_ENV"
          # 留空取最新时运行标题只能写“最新”，实际版本写进运行摘要
          echo "资源包：$PACKAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          ls -l "$RUN_ROOT/release"

      - name: Upload verified resource package
        uses: actions/upload-artifact@v4
        with:
          name: GardendlessResources-${{ env.PACKAGE_TAG }}
          path: |
            ${{ env.RUN_ROOT }}/release/
            ${{ env.REPORTS }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish resource Release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$PACKAGE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$PACKAGE_TAG 已经发布过，相同 packageId 不重复发布"
            exit 1
          fi
          NOTES="游戏版本 $RELEASE_TAG，packageId $(jq -r .packageId "$REPORTS/package-build.json")。"
          if [[ -n "$BASE_TAG" ]]; then
            NOTES+=$'\n\n'"增量包只适用于当前资源是 $BASE_TAG 的加载器，并且需要 0.9.0 之后支持增量导入的 GardendlessLoader；其他情况请导入完整包。"
          fi
          gh release create "$PACKAGE_TAG" "$RUN_ROOT"/release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$PACKAGE_TAG" \
            --notes "$NOTES"
