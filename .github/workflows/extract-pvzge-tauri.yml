name: Extract PvZGE Lite Tauri Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Gzh0821/pvzg_site 的 Release 标签（留空则使用最新版）"
        required: false

      enable_audio_lazy_loading:
        description: "构建时修改运行时代码，使音频仅在播放时加载"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TAURI_DUMPER_VERSION: "0.2.2"

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 获取 pvzge-lite-*.zip
      # ------------------------------------------------------------

      - name: Download and unpack PvZGE Lite
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          REPO="Gzh0821/pvzg_site"

          mkdir -p input reports

          RELEASE_TAG="$REQUESTED_RELEASE_TAG"

          # 未指定 Release 标签时使用 Latest Release
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$(
              gh release view \
                --repo "$REPO" \
                --json tagName \
                --jq '.tagName'
            )"
          fi

          if [[ -z "$RELEASE_TAG" ]]; then
            echo "::error::$REPO 没有可用的 Release"
            exit 1
          fi

          echo "===== Release ====="
          echo "$RELEASE_TAG"

          # 获取 Release 中全部资源文件
          RELEASE_JSON="$(
            gh release view "$RELEASE_TAG" \
              --repo "$REPO" \
              --json assets
          )"

          echo "===== Release assets ====="
          jq -r '.assets[].name' <<< "$RELEASE_JSON"

          # 只选择：
          #
          # pvzge-lite-*.zip
          #
          # 例如：
          # pvzge-lite-0.13.0.zip
          mapfile -t ASSET_CANDIDATES < <(
            jq -r '.assets[].name' <<< "$RELEASE_JSON" \
              | grep -Ei '^pvzge-lite-.+\.zip$' \
              || true
          )

          if [[ "${#ASSET_CANDIDATES[@]}" -eq 0 ]]; then
            echo "::error::Release $RELEASE_TAG 中没有找到 pvzge-lite-*.zip"
            exit 1
          fi

          if [[ "${#ASSET_CANDIDATES[@]}" -ne 1 ]]; then
            echo "::error::Release $RELEASE_TAG 中找到多个 pvzge-lite-*.zip，无法确定使用哪一个"
            echo "===== Candidates ====="
            printf '%s\n' "${ASSET_CANDIDATES[@]}"
            exit 1
          fi

          ASSET_NAME="${ASSET_CANDIDATES[0]}"
          DOWNLOAD="input/$ASSET_NAME"

          echo "===== Selected asset ====="
          echo "$ASSET_NAME"

          # 下载指定 ZIP
          gh release download "$RELEASE_TAG" \
            --repo "$REPO" \
            --pattern "$ASSET_NAME" \
            --dir input

          if [[ ! -s "$DOWNLOAD" ]]; then
            echo "::error::没有下载到有效文件：$DOWNLOAD"
            exit 1
          fi

          echo "===== Downloaded file ====="
          ls -lh "$DOWNLOAD"

          echo "===== SHA-256 ====="
          sha256sum "$DOWNLOAD"

          # ----------------------------------------------------------
          # 从 ZIP 中查找 EXE
          # ----------------------------------------------------------

          mapfile -t EXE_ENTRIES < <(
            unzip -Z1 "$DOWNLOAD" \
              | grep -Ei '\.exe$' \
              || true
          )

          if [[ "${#EXE_ENTRIES[@]}" -eq 0 ]]; then
            echo "::error::$DOWNLOAD 中没有找到 EXE"
            exit 1
          fi

          if [[ "${#EXE_ENTRIES[@]}" -ne 1 ]]; then
            echo "::error::$DOWNLOAD 必须恰好包含一个 EXE，实际找到 ${#EXE_ENTRIES[@]} 个"
            echo "===== EXE candidates ====="
            printf '%s\n' "${EXE_ENTRIES[@]}"
            exit 1
          fi

          EXE_ENTRY="${EXE_ENTRIES[0]}"
          EXE="input/$(basename -- "$EXE_ENTRY")"

          echo "===== Extract EXE ====="
          echo "$EXE_ENTRY"
          echo "-> $EXE"

          unzip -p \
            "$DOWNLOAD" \
            "$EXE_ENTRY" \
            > "$EXE"

          if [[ ! -s "$EXE" ]]; then
            echo "::error::没有得到可用的 EXE：$EXE"
            exit 1
          fi

          echo "===== EXE ====="
          ls -lh "$EXE"
          sha256sum "$EXE"

          # 后续步骤使用
          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "ASSET_NAME=$ASSET_NAME"
            echo "EXE=$EXE"
          } >> "$GITHUB_ENV"

          {
            echo "release_tag=$RELEASE_TAG"
            echo "asset_name=$ASSET_NAME"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # tauri-dumper
      # ------------------------------------------------------------

      - name: Cache tauri-dumper
        id: cache_tauri_dumper
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-dumper
          key: ${{ runner.os }}-tauri-dumper-${{ env.TAURI_DUMPER_VERSION }}

      - name: Install Rust
        if: steps.cache_tauri_dumper.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-dumper
        if: steps.cache_tauri_dumper.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cargo install \
            tauri-dumper \
            --version "$TAURI_DUMPER_VERSION" \
            --locked

      - name: Configure tauri-dumper
        shell: bash
        run: |
          set -euo pipefail

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          if [[ ! -x "$HOME/.cargo/bin/tauri-dumper" ]]; then
            echo "::error::tauri-dumper 不存在"
            exit 1
          fi

          "$HOME/.cargo/bin/tauri-dumper" --version

      # ------------------------------------------------------------
      # 检查 Tauri
      # ------------------------------------------------------------

      - name: Verify Tauri assets
        shell: bash
        run: |
          set -euo pipefail

          tauri-dumper verify "$EXE" \
            2>&1 | tee reports/tauri-verify.txt

      # ------------------------------------------------------------
      # 列出嵌入资源
      # ------------------------------------------------------------

      - name: List embedded assets
        shell: bash
        run: |
          set -euo pipefail

          tauri-dumper list "$EXE" \
            | tee reports/assets-tree.txt

          tauri-dumper list "$EXE" \
            --json \
            > reports/assets.json

      # ------------------------------------------------------------
      # 提取
      # ------------------------------------------------------------

      - name: Extract embedded assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs

          tauri-dumper extract "$EXE" \
            -o docs \
            --overwrite \
            2>&1 | tee reports/tauri-extract.txt

      # ------------------------------------------------------------
      # 检查提取结果
      # ------------------------------------------------------------

      - name: Check extracted Web files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== 提取目录大小 ====="
          du -sh docs

          echo "===== 目标文件与目录 ====="

          find docs \
            \( \
              -name "index.html" \
              -o -name "application.js" \
              -o -name "assets" \
              -o -name "src" \
              -o -name "cocos-js" \
            \) \
            -print \
            | tee reports/target-files.txt

          INDEX_HTML="$(
            find docs \
              -type f \
              -name "index.html" \
              -print \
              -quit
          )"

          if [[ -z "$INDEX_HTML" ]]; then
            echo "::error::没有找到 index.html"
            exit 1
          fi

          echo "index.html: $INDEX_HTML"

      # ------------------------------------------------------------
      # 音频懒加载
      #
      # 注意：
      # 这里只修改运行时加载逻辑。
      # 不进行 MP3/AAC/M4A 转码或压缩。
      # ------------------------------------------------------------

      - name: Patch runtime for lazy DOM audio loading
        if: ${{ inputs.enable_audio_lazy_loading }}
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/patch_audio_runtime.py \
            docs \
            reports/audio-runtime-patch.txt

      # ------------------------------------------------------------
      # 最终检查
      # ------------------------------------------------------------

      - name: Show final asset size
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Final docs size ====="
          du -sh docs

          echo "===== File count ====="
          find docs -type f | wc -l

          echo "===== Reports ====="
          find reports \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ------------------------------------------------------------
      # 上传
      # ------------------------------------------------------------

      - name: Upload extracted assets
        uses: actions/upload-artifact@v4
        with:
          name: pvzge-lite-${{ steps.download.outputs.release_tag }}
          path: |
            docs/
            reports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
